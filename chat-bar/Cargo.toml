[package]
name = "chat_bar"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
#serde = { version = "1.0", features = ["derive"] }
#serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5.31", features = ["derive", "env"] }
crossterm = { version = "0.27.0" }
futures = "0.3.30"
#serde = "1.0.216"
#thiserror.workspace = true
#tokio = { workspace = true, features = ["full"] }
#tracing = { workspace = true, features = ["std", "attributes"] }
git2 = "0.18"
hostname = "0.3.1"
libp2p = { version = "0.54.1", features = [
  "tokio",
  "gossipsub",
  "mdns",
  "noise",
  "macros",
  "tcp",
  "yamux",
  "quic",
] }
#async-utility.workspace = true
#clap = { version = "4.4.18", features = ["derive"] }
lnurl-pay = { version = "0.6", features = ["api"], optional = true }
nostr-sdk = "0.37"
#tui-input = "*"
once_cell = "1.19.0"
ratatui = "0.29"
#nostr = { workspace = true, features = ["std"] }
#nostr-database.workspace = true
#nostr-relay-pool.workspace = true
#nostr-zapper = { workspace = true, optional = true }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.114"
#nostr-sdk = "0.26"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1.37", features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-input = "0.11.1"
#ureq = "3.0.10"
ureq = { version = "2", features = ["json", "charset"] }

